<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Lure: you can't attack. Lead your pursuers into rocks, walls and each other. A new daily course every day.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Lure</title>
<style>
:root{--bg:#0b0d12;--fg:#e8ecf3;--dim:#8a93a6;--panel:#151925;--accent:#7cf2c8;--line:#2a3142;--warn:#ff6b5b;--ghost:#b9c4ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#0e1118;border:1px solid var(--line);border-radius:6px;touch-action:none}
@media (pointer:coarse){canvas{border:0;border-radius:0}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.74);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box}
.card.menu{text-align:center;width:min(440px,calc(100vw - 32px))}
.card.menu ul{text-align:left}
h1{margin:0 0 4px;font-size:34px;letter-spacing:.14em}
h2{margin:0 0 6px;font-size:20px}
.dim{color:var(--dim)}
.small{font-size:12px}
label{display:block;margin:14px 0 6px;font-weight:600}
textarea{width:100%;box-sizing:border-box;background:#0e1118;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical;-webkit-user-select:text;user-select:text}
.chips,.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#0e1118;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--accent);color:#06110d;border-color:var(--accent)}
.chip.warn.on{background:var(--warn);border-color:var(--warn);color:#1a0603}
.chip:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.row.center{justify-content:center;margin-top:12px}
button.main{background:var(--accent);color:#06110d;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
button.main.big{font-size:18px;padding:12px 40px;margin-top:16px;border-radius:999px;letter-spacing:.06em}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.daily{margin:16px 0 4px;padding:12px 14px;border:1px solid #3a4266;border-radius:10px;background:#141a2e}
.daily-head{color:var(--ghost);font-weight:800;letter-spacing:.1em;font-size:13px;margin-bottom:4px}
.daily-best{margin-top:6px;font-size:15px}
.score-big{font-size:44px;font-weight:800;letter-spacing:.04em;margin:4px 0}
.badge{display:inline-block;background:var(--accent);color:#06110d;font-weight:800;letter-spacing:.12em;border-radius:999px;padding:3px 12px;font-size:12px;margin-bottom:8px}
details{margin-top:16px;text-align:left}
summary{cursor:pointer;color:var(--dim);text-align:center}
.pause-btn{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(21,25,37,.7);color:var(--fg);font-size:14px;cursor:pointer;z-index:2}
a{color:var(--accent)}
kbd{background:#0e1118;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
ul{padding-left:18px;margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script type="module" src="main.js"></script>
</body>
</html>
