# Builds the player version (dist/) and publishes it to GitHub Pages at spacechase.mikaelbrandt.com on every push to master.
name: Deploy web version

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web build needs no dependencies: just the pod lint and the copy step.
      - run: npm run build
      - run: echo spacechase.mikaelbrandt.com > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
